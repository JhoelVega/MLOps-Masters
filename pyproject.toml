[project]
name = "mi-proyecto-mlops"
version = "0.2.0"
description = "MLOps con detección de drift"
authors = [
  {name = "JhoelVega", email = "jhoel.mendozaveg@usantotomas.edu.co"}
]
readme = "README.md"
requires-python = ">=3.12,<3.15"
dependencies = [
  "prefect (==3.8.8)",
  "fastapi (>=0.139,<0.140)",
  "mlflow (==3.17.0)",
  "scikit-learn (==1.9.1)",
  "xgboost (>=3.1,<4.0)",
  "pandas (==3.0.6)",
  "numpy (==2.5.4)",
  "pyyaml (==6.0.3)",
  "evidently (==0.7.14)",
  "scipy (>=1.15,<2.0)",
  "uvicorn (>=0.34,<1.0)"
]

[tool.poetry]
package-mode = false

[tool.poetry.group.dev.dependencies]
pytest = "9.1.1"
httpx = ">=0.27,<1.0"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
