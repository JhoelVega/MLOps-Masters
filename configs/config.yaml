model:

  # Modelo que se utilizará en la ejecución actual
  activo: xgboost

  # Nombre del modelo en MLflow
  nombre: mobile_price_classifier

  modelos:

    random_forest:
      n_estimators: 200
      max_depth: 10
      min_samples_split: 2
      min_samples_leaf: 1
      random_state: 42
      n_jobs: -1

    xgboost:
      n_estimators: 300
      max_depth: 6
      learning_rate: 0.05
      subsample: 0.8
      colsample_bytree: 0.8
